name: CITRA CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  APP_ENV: 'testing'
  JWT_SECRET: 'citra-ci-test-secret-key-at-least-32-bytes-long-2026'

jobs:
  # ============================================================================
  # STAGE 1: Backend Quality, SemVer Parity, Mypy & Pytest Suite (Python 3.11)
  # ============================================================================
  backend-verify:
    name: Backend Unit Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install system dependencies for PyMuPDF & SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmupdf-dev mupdf-tools libsqlite3-0

      - name: Install Python dependencies (CPU-only PyTorch + Dev + ONNX Runtime)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install "onnxruntime>=1.18,<2.0" "optimum[onnxruntime]>=2.0,<3.0"
          pip install --no-build-isolation -e ".[dev,onnx]"

      - name: Verify 5-manifest SemVer parity
        run: |
          python - <<'PY'
          import json, pathlib, re, tomllib

          root = pathlib.Path(".")
          v_root_pkg = json.loads((root / "package.json").read_text("utf-8"))["version"]
          v_web_pkg = json.loads((root / "web/package.json").read_text("utf-8"))["version"]
          v_pyproject = tomllib.loads((root / "pyproject.toml").read_text("utf-8"))["project"]["version"]
          m_py = re.search(
              r'__version__\s*=\s*["\']([^"\']+)["\']',
              (root / "src/integrity_checker/__version__.py").read_text("utf-8"),
          )
          m_ts = re.search(
              r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]",
              (root / "web/src/version.ts").read_text("utf-8"),
          )
          assert m_py and m_ts, "Failed to parse version from __version__.py or web/src/version.ts"
          manifests = {
              "package.json": v_root_pkg,
              "web/package.json": v_web_pkg,
              "pyproject.toml": v_pyproject,
              "src/integrity_checker/__version__.py": m_py.group(1),
              "web/src/version.ts": m_ts.group(1),
          }
          if len(set(manifests.values())) != 1:
              raise SystemExit(f"SemVer mismatch across 5 manifests: {manifests}")
          print(f"SemVer parity verified across all 5 manifests: {v_pyproject}")
          PY

      - name: Prepare test configuration & sample essays
        run: |
          cp -n .env.example .env || true
          cp -n configs/config.example.yaml configs/config.yaml || true
          python scripts/gen_sample_essays.py

      - name: Lint backend & scripts (ruff)
        run: |
          ruff check src/ tests/ scripts/

      - name: Typecheck backend (mypy)
        run: |
          mypy src/integrity_checker

      - name: Run Backend Test Suite
        run: |
          pytest tests/ -q

  # ============================================================================
  # STAGE 2: Frontend Lint, E2E Typecheck, Build & Vitest Suite (React 18 / TS)
  # ============================================================================
  frontend-verify:
    name: Frontend Build & Vitest (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend (ESLint)
        run: npm run lint

      - name: Typecheck E2E specs & tooling configs
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Typecheck & build production SPA bundle
        run: npm run build

      - name: Run Frontend Vitest Unit Suite
        run: npm test

  # ============================================================================
  # STAGE 3: Docker Compose Validation & GHCR Image Build/Push (ghcr.io)
  # ============================================================================
  docker-config-verify:
    name: Validate Compose & Build Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Compose Configurations
        run: |
          cp -n .env.example .env || true
          docker compose -f docker-compose.yml config -q
          JWT_SECRET="${{ env.JWT_SECRET }}" docker compose -f docker-compose.prod.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Production Image (PR / non-main verification)
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/citra-api:ci
          cache-from: type=gha,scope=citra-api
          cache-to: type=gha,scope=citra-api,mode=max

      - name: Build Web Production Image (PR / non-main verification)
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || '' }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/citra-web:ci
          cache-from: type=gha,scope=citra-web
          cache-to: type=gha,scope=citra-web,mode=max

      - name: Build & Push API Image to GHCR (main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/citra-api:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/citra-api:latest
          cache-from: type=gha,scope=citra-api
          cache-to: type=gha,scope=citra-api,mode=max

      - name: Build & Push Web Image to GHCR (main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || '' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/citra-web:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/citra-web:latest
          cache-from: type=gha,scope=citra-web
          cache-to: type=gha,scope=citra-web,mode=max

  # ============================================================================
  # STAGE 4: Automated Production Deployment (https://citra.io.vn)
  # ============================================================================
  deploy:
    name: Auto Deploy to Production (citra.io.vn)
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify, docker-config-verify]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
    concurrency:
      group: citra-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy pre-built GHCR images to Production VM via SSH
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ secrets.GCE_USER }}
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_OWNER: ${{ needs.docker-config-verify.outputs.ghcr_owner }}
          CITRA_IMAGE_TAG: ${{ github.sha }}
          REPO_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          echo "Deploying CITRA commit ${{ github.sha }} via GHCR to https://citra.io.vn..."
          if [ -z "$GCE_SSH_PRIVATE_KEY" ] || [ -z "$GCE_HOST" ] || [ -z "$GCE_USER" ]; then
            echo "Error: Missing GCE_HOST, GCE_USER, or GCE_SSH_PRIVATE_KEY secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$GCE_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$GCE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Reclaim disk space FIRST (before sed/docker-login/git-fetch) in case rootfs hit ENOSPC.
          # Running containers (integrity-api, integrity-web, essay-check-grobid) keep their active
          # PREV_TAG images protected while all stale SHA-tagged images & aborted ingests are freed.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$GCE_USER@$GCE_HOST" '
            echo ">>> [0/4] Pre-flight VM disk space check & stale image/ingest reclamation..."
            df -h / || true
            if command -v ctr >/dev/null 2>&1; then
              for ns in moby default; do
                for ref in $(sudo ctr -n "$ns" content ingest ls -q 2>/dev/null || true); do
                  sudo ctr -n "$ns" content abort "$ref" >/dev/null 2>&1 || true
                done
              done
            fi
            sudo docker container prune -f >/dev/null 2>&1 || true
            sudo docker image prune -af >/dev/null 2>&1 || true
            sudo docker builder prune -af >/dev/null 2>&1 || true
            sudo journalctl --vacuum-size=100M >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            df -h / || true
          '

          if [ -n "$SERPER_API_KEY" ]; then
            printf '%s' "$SERPER_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$GCE_USER@$GCE_HOST" '
              VAL=$(cat)
              if [ -f /opt/citra/.env ]; then
                sudo sed -i "/^SERPER_API_KEY=/d;/^S2_API_KEY=/d;/^COREAPI_API_KEY=/d" /opt/citra/.env
                printf "\nSERPER_API_KEY=%s\n" "$VAL" | sudo tee -a /opt/citra/.env >/dev/null
              fi
            '
          fi
          if [ -n "$SERPAPI_API_KEY" ]; then
            printf '%s' "$SERPAPI_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$GCE_USER@$GCE_HOST" '
              VAL=$(cat)
              if [ -f /opt/citra/.env ]; then
                sudo sed -i "/^SERPAPI_API_KEY=/d" /opt/citra/.env
                printf "\nSERPAPI_API_KEY=%s\n" "$VAL" | sudo tee -a /opt/citra/.env >/dev/null
              fi
            '
          fi

          # Authenticate VPS Docker client with GHCR over stdin (supports private & public packages)
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$GCE_USER@$GCE_HOST" \
            "sudo docker login ghcr.io -u '$GHCR_ACTOR' --password-stdin >/dev/null"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$GCE_USER@$GCE_HOST" \
            "GHCR_OWNER='$GHCR_OWNER' CITRA_IMAGE_TAG='$CITRA_IMAGE_TAG' REPO_GIT_URL='$REPO_GIT_URL' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' bash -s" << 'EOF'
            set -e
            trap 'sudo docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            ensure_trailing_newline() {
              if [ -s "$1" ] && [ "$(tail -c 1 "$1" | wc -l)" -eq 0 ]; then
                printf '\n' | sudo tee -a "$1" >/dev/null
              fi
            }

            echo ">>> [1/4] Syncing /opt/citra with origin/main..."
            sudo chown -R "$USER":1000 /opt/citra
            cd /opt/citra
            git remote set-url origin "$REPO_GIT_URL"
            git fetch origin main
            git reset --hard origin/main
            git gc --prune=now --quiet || true

            echo ">>> [2/4] Ensuring persistent data directory permissions for container UID 1000..."
            sudo mkdir -p /opt/citra/data/essays/uploads /opt/citra/data/avatars /opt/citra/data/cache/grobid /opt/citra/data/logs
            sudo chown -R 1000:1000 /opt/citra/data
            sudo chmod -R ug+rwX /opt/citra/data

            PREV_TAG=""
            if [ -f /opt/citra/.env ]; then
              PREV_TAG=$(grep -E '^CITRA_IMAGE_TAG=' /opt/citra/.env 2>/dev/null | tail -n 1 | cut -d= -f2- | tr -d '\r"\047 ' || true)
              if [ -n "$GOOGLE_CLIENT_ID" ]; then
                sudo sed -i "/^GOOGLE_CLIENT_ID=/d" /opt/citra/.env
                ensure_trailing_newline /opt/citra/.env
                printf "GOOGLE_CLIENT_ID=%s\n" "$GOOGLE_CLIENT_ID" | sudo tee -a /opt/citra/.env >/dev/null
              fi
            fi
            if [ -z "$PREV_TAG" ]; then
              RUNNING_API_IMAGE=$(sudo docker inspect --format="{{.Config.Image}}" integrity-api 2>/dev/null || true)
              case "$RUNNING_API_IMAGE" in
                *:*)
                  CANDIDATE_TAG=$(printf '%s' "${RUNNING_API_IMAGE##*:}" | tr -d '\r"\047 ')
                  if [ -n "$CANDIDATE_TAG" ] && [ "$CANDIDATE_TAG" != "$CITRA_IMAGE_TAG" ]; then
                    PREV_TAG="$CANDIDATE_TAG"
                  fi
                  ;;
              esac
            fi

            echo ">>> [3/4] Pulling pre-built images from ghcr.io and rolling out containers in-place..."
            CURRENT_GROBID_IMG=$(sudo docker inspect --format="{{.Config.Image}}" essay-check-grobid 2>/dev/null || true)
            CURRENT_GROBID_RUNNING=$(sudo docker inspect --format="{{.State.Running}}" essay-check-grobid 2>/dev/null || true)
            if [ "$CURRENT_GROBID_IMG" != "grobid/grobid:0.9.1-crf" ] || [ "$CURRENT_GROBID_RUNNING" != "true" ]; then
              echo ">>> Updating GROBID container ($CURRENT_GROBID_IMG -> grobid/grobid:0.9.1-crf) and clearing stale TEI cache..."
              sudo rm -f /opt/citra/data/cache/grobid/*.tei.xml 2>/dev/null || true
              sudo docker compose -f docker-compose.prod.yml pull grobid
              sudo docker compose -f docker-compose.prod.yml up -d --force-recreate grobid
              sudo docker rmi lfoppiano/grobid:0.8.0 2>/dev/null || true
            fi

            sudo docker image prune -af >/dev/null 2>&1 || true
            sudo GHCR_OWNER="$GHCR_OWNER" CITRA_IMAGE_TAG="$CITRA_IMAGE_TAG" \
              docker compose -f docker-compose.prod.yml pull api web
            if [ -f /opt/citra/.env ]; then
              sudo sed -i "/^GHCR_OWNER=/d;/^CITRA_IMAGE_TAG=/d" /opt/citra/.env
              ensure_trailing_newline /opt/citra/.env
              printf "GHCR_OWNER=%s\nCITRA_IMAGE_TAG=%s\n" "$GHCR_OWNER" "$CITRA_IMAGE_TAG" | sudo tee -a /opt/citra/.env >/dev/null
            fi
            sudo GHCR_OWNER="$GHCR_OWNER" CITRA_IMAGE_TAG="$CITRA_IMAGE_TAG" \
              docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans api web

            echo ">>> [4/4] Verifying container health (API, GROBID & Web) on 127.0.0.1:8000 and https://citra.io.vn (up to 120s)..."
            HEALTHY=0
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:8070/api/isalive >/dev/null \
                 && curl -sf http://127.0.0.1:8000/api/health | grep -q "\"available\":true" \
                 && curl -sf https://citra.io.vn/api/health >/dev/null; then
                HEALTHY=1
                echo "Production deployment verified healthy (GROBID 0.9.1-crf + GHCR API/Web:$CITRA_IMAGE_TAG) on https://citra.io.vn (attempt $i)!"
                break
              fi
              sleep 2
            done

            sudo docker compose -f docker-compose.prod.yml ps
            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: Production healthcheck failed after rollout!"
              sudo docker compose -f docker-compose.prod.yml logs --tail=50 grobid api web
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CITRA_IMAGE_TAG" ]; then
                echo ">>> Rolling back api & web to previous verified image tag: $PREV_TAG..."
                if [ -f /opt/citra/.env ]; then
                  sudo sed -i "/^CITRA_IMAGE_TAG=/d" /opt/citra/.env
                  ensure_trailing_newline /opt/citra/.env
                  printf "CITRA_IMAGE_TAG=%s\n" "$PREV_TAG" | sudo tee -a /opt/citra/.env >/dev/null
                fi
                sudo GHCR_OWNER="$GHCR_OWNER" CITRA_IMAGE_TAG="$PREV_TAG" \
                  docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans api web
              elif [ -f /opt/citra/.env ]; then
                sudo sed -i "/^CITRA_IMAGE_TAG=/d" /opt/citra/.env
              fi
              exit 1
            fi

            echo ">>> Pruning superseded container images after verified healthy rollout..."
            sudo docker image prune -f -a >/dev/null 2>&1 || true
            sudo docker builder prune -af >/dev/null 2>&1 || true
            df -h / || true
          EOF
