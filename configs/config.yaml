# =====================================================================
# config.yaml — runtime configuration
# Synchronized with config.example.yaml and Pydantic Settings (v3.90.2).
# =====================================================================

app:
  name: "Essay Integrity Checker"
  # version: derived from integrity_checker.__version__ (override via APP_VERSION env)
  env: development
  debug: true
  log_level: INFO

# --- Persistence ---
database:
  url: "sqlite:///./data/app.db"
  echo: false

# --- Paths ---
paths:
  data_dir: "./data"
  essays_dir: "./data/essays"
  cache_dir: "./data/cache"
  grobid_output_dir: "./data/cache/grobid"

# --- PDF & Document parsing ---
extraction:
  # parser: mupdf | pdfplumber | hybrid | grobid_hybrid
  parser: grobid_hybrid
  fallback_to_ocr: false
  min_text_length: 50

  # GROBID service (Docker Compose)
  grobid:
    enabled: true
    # URL: http://localhost:8070 (local dev) or http://grobid:8070 (Docker internal)
    url: "http://localhost:8070"
    timeout_seconds: 120
    cache_by_file_sha256: true
    consolidate_header: ["abstract", "body", "bibliography", "footnote", "appendix"]

# --- Citation style detection ---
style_detection:
  min_occurrences_to_classify: 5
  mixed_threshold: 0.3
  unknown_threshold: 0.15
  features:
    apa_author_year_pattern: "\\([A-Z][^()]{0,80},\\s*(19|20)\\d{2}[a-z]?\\)"
    ieee_numeric_pattern: "\\[\\d+(?:\\s*[-,]\\s*\\d+)*\\]"
  output:
    classes: ["APA-like", "IEEE-like", "MIXED", "UNKNOWN"]

# --- Bidirectional citation linking (8 statuses: 7 link/issue states + UNRESOLVED neutral) ---
linking:
  exclude_sections: ["references", "bibliography", "tài liệu tham khảo", "appendix", "phụ lục"]

  duplicate_detection:
    exact_identifier_match: true
    title_year_author_similarity: 0.92

  statuses:
    enabled:
      - MATCHED
      - MISSING_REFERENCE
      - UNCITED_REFERENCE
      - IN_TEXT_MISMATCH
      - DUPLICATE_REFERENCE
      - AMBIGUOUS_MAPPING
      - STYLE_INCONSISTENT

  same_author_year_resolution:
    use_title_metadata: true
    use_first_author: true

# --- Multi-source retrieval (15+ scholarly & technical APIs) ---
retrieval:
  sources:
    crossref: true
    openalex: true
    dblp: true
    arxiv: true
    openlibrary: true
    europepmc: true
    datacite: true
    doi_ra: true
    doaj: true
    openaire_hal: true
    ncbi_biorxiv: true
    huggingface: true
    tech_standard: true
    wikidata_opencitations: true
    wayback_fallback: true
    serpapi: true
    serpapi_quota_guard: true
  per_source_top_k: 5
  parallel: true
  retry:
    enabled: true
    max_attempts: 5
    backoff:
      initial_seconds: 1.0
      max_seconds: 120.0
      multiplier: 1.5
  rate_limits:
    crossref_per_sec: 25.0
    openalex_per_sec: 8.0
    dblp_per_sec: 1.5
    arxiv_per_sec: 1.0
    openlibrary_per_sec: 3.0
    europepmc_per_sec: 5.0
    datacite_per_sec: 5.0
    doi_ra_per_sec: 10.0
    doaj_per_sec: 2.0
    openaire_hal_per_sec: 3.0
    ncbi_biorxiv_per_sec: 3.0
    huggingface_per_sec: 5.0
    tech_standard_per_sec: 5.0
    wikidata_opencitations_per_sec: 5.0
    serper_per_sec: 5.0
    serpapi_per_sec: 1.0
  max_concurrent_pipelines: 3
  max_concurrent_grobid: 2
  max_global_retrievals: 12
  per_essay_retrievals: 6
  singleflight_enabled: true
  negative_cache_ttl_seconds: 21600
  negative_cache_max_entries: 4096
  contact_email: "noreply@citra.edu.vn"

# --- Matching thresholds & encoders ---
matching:
  title_sim_verified: 0.9
  title_sim_metadata_error: 0.6
  author_jaccard_verified: 0.5
  year_tolerance: 1
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  multilingual_embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  enable_multilingual_encoder: true
  onnx_quantized: true
  cross_lingual_sim_boost: 0.08
  fuzzy:
    token_set_ratio_threshold: 0.85
    partial_ratio_threshold: 0.80

# --- Symbolic rules + abstention ---
logic:
  abstention_low: 0.4
  abstention_high: 0.6
  require_consensus_for_verified: 2
  require_consensus_for_metadata_error: 1

  new_rules:
    domain_exception_broken_link: true
    ambiguous_mapping: true
    style_inconsistent_override: false

# --- Citation Integrity Score weights (Total = 1.0) ---
cis:
  weights:
    verified_ratio: 0.35
    metadata_accuracy: 0.25
    in_text_bib_consistency: 0.25
    format_consistency: 0.10
    identifier_validity: 0.05
  rubric_penalty:
    MISSING_REFERENCE: 0.20
    UNCITED_REFERENCE: 0.10
    IN_TEXT_MISMATCH: 0.15
    DUPLICATE_REFERENCE: 0.10
    AMBIGUOUS_MAPPING: 0.05
    STYLE_INCONSISTENT: 0.02

# --- Decision-support disclaimer ---
disclaimer:
  short: "Decision-support only — not a final grade."
  long: >
    Hệ thống này chỉ hỗ trợ giảng viên rà soát tính toàn vẹn trích dẫn trong tiểu luận.
    Hai lớp kết quả (đối chiếu in-text ↔ reference entry và độ tin cậy nguồn) đều là
    gợi ý dựa trên bằng chứng từ các cơ sở dữ liệu học thuật công khai và quy luật
    Neuro-Symbolic có thể giải thích. Kết luận `SUSPECTED_HALLUCINATION` chỉ là nghi vấn
    cần kiểm tra — không đồng nghĩa nguồn bị bịa đặt hay kết luận gian lận học thuật.
    Giảng viên là người ra quyết định cuối cùng.

# --- Out-of-scope ---
out_of_scope:
  - "Chấm điểm content / organization / language / vocabulary / mechanics"
  - "AES rubric (QWK, holistic scoring)"
  - "Phát hiện đạo văn văn bản thuần túy"
  - "Phát hiện toàn bộ văn bản do AI tạo"
  - "Tự động kết luận gian lận học thuật"
  - "Claim-level fact-checking toàn diện ngoài ngữ cảnh trích dẫn"
  - "Phán xét việc trích cùng một nguồn nhiều lần là dư thừa"
