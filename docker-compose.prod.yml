# =====================================================================
# docker-compose.prod.yml — Essay Integrity Checker (Production)
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --no-build
#   docker compose -f docker-compose.prod.yml up --build -d   # (Optional local build fallback)
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api web
# =====================================================================

services:
  # ---------------------------------------------------------------------------
  # GROBID — PDF reference extraction service (internal network + localhost)
  # ---------------------------------------------------------------------------
  grobid:
    image: grobid/grobid:0.9.1-crf
    container_name: essay-check-grobid
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:8070:8070"
    entrypoint:
      - /bin/sh
      - /opt/grobid/citra-grobid-entrypoint.sh
    environment:
      # GROBID 0.9.1-crf native Wapiti CRF models occupy ~3.1 GiB off-heap RAM; keep
      # JVM heap compact (-Xmx768m) with G1 periodic heap shrink + ExitOnOutOfMemoryError
      # inside a 4G container so total working set stays swap-free on 2-vCPU / 6GB VM.
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1PeriodicGCInterval=60000 -XX:G1PeriodicGCSystemLoadThreshold=0.5 -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=15 -XX:+ExitOnOutOfMemoryError
      - GROBID_CONCURRENCY=2
      - GROBID_POOL_MAX_WAIT=30
      - GROBID_PDFALTO_MEMORY_MB=1024
      - GROBID_MODEL_PRELOAD=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    networks:
      - essay-check-net
    volumes:
      - grobid-cache:/opt/grobid/grobid-home/cache
      - ./scripts/grobid-entrypoint.sh:/opt/grobid/citra-grobid-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8070 && printf "GET /api/isalive HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'''
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # API — FastAPI backend (Production: pre-built GHCR image + local build fallback)
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/${GHCR_OWNER:-iannwendy}/citra-api:${CITRA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs/config.docker.yaml:/app/configs/config.yaml:ro
      - ./.env:/app/.env:ro
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-WARNING}
      - CITRA_WORKER_MODE=${CITRA_WORKER_MODE:-inline}
      # Pinned directly to match GROBID_CONCURRENCY=2 on the 2-vCPU / 6GB VM
      # (immune to higher values copied from .env.example into /opt/citra/.env).
      - MAX_CONCURRENT_PIPELINES=2
      - MAX_CONCURRENT_GROBID=2
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a strong secret in production}
      - GROBID_URL=http://grobid:8070
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - FRONTEND_URL=${FRONTEND_URL:-https://citra.io.vn}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - essay-check-net
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1G
    # Inline worker mode holds process-local ProgressTracker SSE state & ~1 GB SBERT/ONNX models
    # in memory, so `--workers 1` is strictly pinned. `--forwarded-allow-ips="127.0.0.1"` prevents
    # Uvicorn from overwriting Docker bridge `request.client.host` with spoofed X-Forwarded-For,
    # allowing `_extract_client_ip()` to read Nginx's trusted `X-Real-IP: $remote_addr`.
    command: >
      uvicorn integrity_checker.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --proxy-headers
      --forwarded-allow-ips="127.0.0.1"

  # ---------------------------------------------------------------------------
  # Web — Nginx Static SPA + /api Reverse Proxy
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/${GHCR_OWNER:-iannwendy}/citra-web:${CITRA_IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: integrity-web
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - essay-check-net

networks:
  essay-check-net:
    driver: bridge

volumes:
  grobid-cache:
    driver: local
